name: Deploy Next.js App to Azure Web App - medsenseclient

on:
  push:
    branches:
      - ProdLatest20-01-2026
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      # Install only to validate dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ❌ DO NOT RUN npm run build here
      # Azure Oryx will build correctly

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: medsenseclient
          slot-name: Production
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4CD99C0A8E5644A59F1852B46B253D9A }}
